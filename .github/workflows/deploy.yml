name: Deploy to GitHub Pages

# The portfolio lives at https://pangilinanervin22.vercel.app (Vercel builds every
# push to `main`). GitHub Pages only forwards the old address,
# pangilinanervin22.github.io/portfolio, to it: this publishes the one page in
# .github/pages-redirect, as index.html and again as 404.html so deep links forward too.
on:
        push:
                branches: [main]
                paths:
                        - ".github/pages-redirect/**"
                        - ".github/workflows/deploy.yml"
        # Allows you to run this workflow manually from the Actions tab on GitHub.
        workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
        contents: read
        pages: write
        id-token: write

jobs:
        build:
                runs-on: ubuntu-latest
                steps:
                        - name: Checkout your repository using git
                          uses: actions/checkout@v4
                        - name: Serve the forwarding page for every path
                          run: cp .github/pages-redirect/index.html .github/pages-redirect/404.html
                        - name: Upload the forwarding page
                          uses: actions/upload-pages-artifact@v3
                          with:
                            path: .github/pages-redirect

        deploy:
                needs: build
                runs-on: ubuntu-latest
                environment:
                        name: github-pages
                        url: ${{ steps.deployment.outputs.page_url }}
                steps:
                        - name: Deploy to GitHub Pages
                          id: deployment
                          uses: actions/deploy-pages@v4
